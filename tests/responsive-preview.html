<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vista de prueba responsiva</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090c12;color:#e2e8f0;font-family:Arial,sans-serif;padding:24px;min-width:max-content}.label{font-size:13px;margin:0 0 10px;color:#94a3b8}.frame{display:block;border:1px solid #334155;border-radius:12px;background:#0f1117;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  </style>
</head>
<body>
  <div class="label" id="label"></div><iframe class="frame" id="frame"></iframe>
  <script>
    const q=new URLSearchParams(location.search),device=q.get('device')||'phone',module=q.get('module')||'dashboard';
    const sizes={phone:[390,844],tablet:[768,1024],desktop:[1280,800]},size=sizes[device]||sizes.phone;
    const frame=document.getElementById('frame');frame.width=size[0];frame.height=size[1];frame.src=`responsive-fixture.html?module=${encodeURIComponent(module)}`;
    document.getElementById('label').textContent=`${device.toUpperCase()} · ${size[0]} × ${size[1]} · ${module}`;
  </script>
</body>
</html>
