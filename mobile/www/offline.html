<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a33">
  <title>C&A CRM · Sin conexión</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071a33;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;padding:28px;box-sizing:border-box}
    main{text-align:center;max-width:420px}
    .mark{width:68px;height:68px;border:1px solid #c9a96e;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;color:#e4c36f;font:700 27px Georgia,serif}
    h1{font-size:22px;margin:0 0 10px}
    p{opacity:.76;line-height:1.5;margin:0 0 18px}
    button{border:1px solid #c9a96e;background:transparent;color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
  </style>
</head>
<body>
  <main>
    <div class="mark">C&amp;A</div>
    <h1>No fue posible conectar con el CRM</h1>
    <p>Verifica tu conexión a internet y vuelve a intentarlo. La información del CRM permanece segura en la nube.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
