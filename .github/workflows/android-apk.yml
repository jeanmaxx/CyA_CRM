name: Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app-mobile-native.js'
      - 'app-mobile-push-v13.js'
      - 'app-mobile-native-links.js'
      - 'app-mobile-password-hotfix.js'
      - 'app-mobile-fcm-guard.js'
      - 'app-renapo-verification-fix.js'
      - 'app-contract-history-pdf.js'
      - '_worker.js'
      - 'supabase/functions/mobile-push/**'
      - 'supabase/migrations/*mobile_notifications*'
      - 'supabase/migrations/*closed_app_lead_push*'
      - 'supabase/migrations/*mobile_push_delivery_fk_indexes*'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app-mobile-native.js'
      - 'app-mobile-push-v13.js'
      - 'app-mobile-native-links.js'
      - 'app-mobile-password-hotfix.js'
      - 'app-mobile-fcm-guard.js'
      - 'app-renapo-verification-fix.js'
      - 'app-contract-history-pdf.js'
      - '_worker.js'
      - 'supabase/functions/mobile-push/**'
      - 'supabase/migrations/*mobile_notifications*'
      - 'supabase/migrations/*closed_app_lead_push*'
      - 'supabase/migrations/*mobile_push_delivery_fk_indexes*'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build C&A CRM Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate mobile JavaScript syntax
        shell: bash
        run: |
          node --check app-mobile-native.js
          node --check app-mobile-push-v13.js
          node --check app-mobile-native-links.js
          node --check app-mobile-password-hotfix.js
          node --check app-mobile-fcm-guard.js
          node --check app-renapo-verification-fix.js
          node --check app-contract-history-pdf.js
          node --check _worker.js
          node --check mobile/scripts/patch-android.mjs

      - name: Validate closed-app push wiring
        shell: bash
        run: |
          grep -q 'FIREBASE_SERVICE_ACCOUNT_JSON' supabase/functions/mobile-push/index.ts
          grep -q 'cya_dispatch_new_lead_mobile_push' supabase/migrations/20261031090038_closed_app_lead_push_scaffold.sql
          grep -q 'disable trigger cya_new_lead_mobile_push' supabase/migrations/20261031090038_closed_app_lead_push_scaffold.sql
          test -s supabase/migrations/20261031090129_mobile_push_delivery_fk_indexes.sql
          grep -q 'app-mobile-push-v13.js' _worker.js

      - name: Validate Firebase Android client
        shell: bash
        run: |
          test -s mobile/firebase/google-services.json
          node -e "const f=require('./mobile/firebase/google-services.json'); const p=f.client?.[0]?.client_info?.android_client_info?.package_name; if(p!=='com.alvasd.cya.crm') throw new Error('Firebase package mismatch: '+p); console.log('Firebase package OK:',p)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Validate padded C&A Android branding
        shell: bash
        run: test -s mobile/assets/logo.svg

      - name: Generate and patch Android project
        working-directory: mobile
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets \
            --iconBackgroundColor '#071A33' \
            --iconBackgroundColorDark '#071A33' \
            --splashBackgroundColor '#071A33' \
            --splashBackgroundColorDark '#071A33'
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Install Firebase configuration
        working-directory: mobile
        shell: bash
        run: |
          cp firebase/google-services.json android/app/google-services.json
          test -s android/app/google-services.json
          echo 'Firebase configuration installed for C&A CRM Android 1.3.0.'

      - name: Build debug APK
        working-directory: mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p mobile/output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/output/CYA-CRM-1.3.0-debug.apk
          sha256sum mobile/output/CYA-CRM-1.3.0-debug.apk | tee mobile/output/CYA-CRM-1.3.0-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYA-CRM-Android-1.3.0-debug
          path: |
            mobile/output/CYA-CRM-1.3.0-debug.apk
            mobile/output/CYA-CRM-1.3.0-debug.sha256
          if-no-files-found: error
          retention-days: 14
