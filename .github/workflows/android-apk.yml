name: Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app-mobile-native.js'
      - 'app-mobile-native-links.js'
      - '_worker.js'
      - 'supabase/migrations/*mobile_notifications*'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app-mobile-native.js'
      - 'app-mobile-native-links.js'
      - '_worker.js'
      - 'supabase/migrations/*mobile_notifications*'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build C&A CRM Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate mobile JavaScript syntax
        shell: bash
        run: |
          node --check app-mobile-native.js
          node --check app-mobile-native-links.js
          node --check _worker.js
          node --check mobile/scripts/patch-android.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Validate padded C&A Android branding
        shell: bash
        run: test -s mobile/assets/logo.svg

      - name: Generate and patch Android project
        working-directory: mobile
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets \
            --iconBackgroundColor '#071A33' \
            --iconBackgroundColorDark '#071A33' \
            --splashBackgroundColor '#071A33' \
            --splashBackgroundColorDark '#071A33'
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Add Firebase configuration when available
        working-directory: mobile
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.CYA_FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
            echo 'Firebase configuration installed for this build.'
          else
            echo 'Firebase configuration not present; local notifications remain available and remote FCM registration will stay inactive.'
          fi

      - name: Build debug APK
        working-directory: mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p mobile/output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/output/CYA-CRM-1.1.0-debug.apk
          sha256sum mobile/output/CYA-CRM-1.1.0-debug.apk | tee mobile/output/CYA-CRM-1.1.0-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYA-CRM-Android-1.1.0-debug
          path: |
            mobile/output/CYA-CRM-1.1.0-debug.apk
            mobile/output/CYA-CRM-1.1.0-debug.sha256
          if-no-files-found: error
          retention-days: 14
