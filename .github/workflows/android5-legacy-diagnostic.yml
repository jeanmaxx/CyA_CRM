name: Android 5 isolated diagnostic APK
on:
  push:
    branches:
      - prototype/rca-android5-legacy-20261118
    paths:
      - 'legacy-android5/**'
      - '.github/workflows/android5-legacy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Print tool versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Build diagnostic APK
        working-directory: legacy-android5
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug
      - name: Check APK exists
        run: test -s legacy-android5/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: cya-legacy-android5-diagnostic-apk
          path: legacy-android5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
