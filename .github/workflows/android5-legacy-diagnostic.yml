name: Android 5 isolated diagnostic APK
on:
  push:
    branches:
      - prototype/rca-android5-legacy-20261118
    paths:
      - 'legacy-android5/**'
      - '.github/workflows/android5-legacy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
      - name: Install SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Runner SDK manager unavailable"
            exit 1
          fi
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Print tool versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Build diagnostic APK
        working-directory: legacy-android5
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug
      - name: Check APK exists
        run: test -s legacy-android5/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish phase 2 APK through GitHub API
        uses: actions/github-script@v7
        env:
          APK_PATH: legacy-android5/app/build/outputs/apk/debug/app-debug.apk
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'legacy-android5/dist/CyA_CRM_Legacy_Android5_Fase2.apk';
            const branch = 'prototype/rca-android5-legacy-20261118';
            const content = fs.readFileSync(process.env.APK_PATH).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: branch});
              sha = existing.data.sha;
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path, branch,
              message: 'Publish phase 2 diagnostic APK [skip ci]', content, ...(sha ? {sha} : {})
            });
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: cya-legacy-android5-phase2-apk
          path: legacy-android5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
