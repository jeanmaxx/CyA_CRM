name: Android 5 isolated diagnostic APK
on:
  push:
    branches:
      - prototype/rca-android5-legacy-20261118
    paths:
      - 'legacy-android5/**'
      - '.github/workflows/android5-legacy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build diagnostic APK
        working-directory: legacy-android5
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK
        run: test -s legacy-android5/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cya-legacy-android5-diagnostic-apk
          path: legacy-android5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
