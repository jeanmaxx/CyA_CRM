<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Estructura del Número de Seguridad Social, NSS</title>
<desc id="desc">Ejemplo de once dígitos: 02 subdelegación, 98 año de afiliación, 90 año de nacimiento, 0134 consecutivo y 4 dígito verificador.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9f5f5"/><stop offset="1" stop-color="#f9fbff"/></linearGradient><filter id="shadow" x="-15%" y="-25%" width="130%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#102b3f" flood-opacity=".16"/></filter></defs>
<rect width="1200" height="600" rx="22" fill="url(#bg)"/>
<rect x="26" y="25" width="1148" height="112" rx="18" fill="#e0efec"/>
<text x="600" y="77" font-family="Arial,sans-serif" text-anchor="middle" font-size="39" font-weight="800" fill="#134f43">ESTRUCTURA DEL NSS</text>
<text x="600" y="118" font-family="Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="700" fill="#906d37">11 DÍGITOS ÚNICOS</text>
<g filter="url(#shadow)" font-family="Arial,sans-serif" font-size="62" font-weight="800" text-anchor="middle" fill="white">
<rect x="105" y="167" width="155" height="116" rx="18" fill="#23749b"/><text x="182" y="245">02</text>
<rect x="277" y="167" width="155" height="116" rx="18" fill="#d0792d"/><text x="354" y="245">98</text>
<rect x="449" y="167" width="155" height="116" rx="18" fill="#21806e"/><text x="526" y="245">90</text>
<rect x="621" y="167" width="305" height="116" rx="18" fill="#dba71e"/><text x="774" y="245">0134</text>
<rect x="943" y="167" width="150" height="116" rx="18" fill="#bc4647"/><text x="1018" y="245">4</text>
</g>
<g stroke-width="4" fill="none" stroke-linecap="round">
<path d="M182 284 V317" stroke="#23749b"/><path d="M354 284 V317" stroke="#d0792d"/>
<path d="M526 284 V317" stroke="#21806e"/><path d="M774 284 V317" stroke="#dba71e"/><path d="M1018 284 V317" stroke="#bc4647"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="182" y="351" font-size="23" font-weight="800" fill="#1a5470">SUBDELEGACIÓN</text>
<text x="354" y="351" font-size="23" font-weight="800" fill="#9d5419">AFILIACIÓN</text>
<text x="526" y="351" font-size="23" font-weight="800" fill="#1d675a">NACIMIENTO</text>
<text x="774" y="351" font-size="23" font-weight="800" fill="#88660c">CONSECUTIVO</text>
<text x="1018" y="351" font-size="23" font-weight="800" fill="#a1373a">VERIFICADOR</text>
<g font-size="20" fill="#1a3440">
<text x="182" y="390">Clave de la oficina</text><text x="182" y="418">del primer registro</text>
<text x="354" y="390">Año en que se</text><text x="354" y="418">registró al IMSS</text>
<text x="526" y="390">Año de nacimiento</text><text x="526" y="418">del asegurado</text>
<text x="774" y="390">Número de control</text><text x="774" y="418">asignado al registro</text>
<text x="1018" y="390">Dígito de</text><text x="1018" y="418">control</text>
</g></g>
<rect x="60" y="475" width="1080" height="90" rx="16" fill="#fff" stroke="#a9c8c7" stroke-width="2"/>
<text x="86" y="510" font-size="21" font-family="Arial,sans-serif" font-weight="800" fill="#13554c">RECUERDA</text>
<text x="86" y="539" font-size="18" font-family="Arial,sans-serif" fill="#253f47">El NSS identifica al trabajador. Para validar semanas cotizadas y régimen pensionario, consulta los documentos oficiales del IMSS.</text>
</svg>